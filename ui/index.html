<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EMOTIV Brain Light</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>

<!-- ─── Language picker (first run) ───────────────────────────────────────── -->
<div id="welcome" class="overlay hidden">
  <div class="welcome-card">
    <div class="orb-mini"></div>

    <div id="welcome-language">
      <h1 data-i18n="welcome.title">Choose your language</h1>
      <div class="lang-grid">
        <button class="lang-btn" data-lang="en">
          <span class="lang-flag">EN</span>
          <span class="lang-name">English</span>
        </button>
        <button class="lang-btn" data-lang="zh">
          <span class="lang-flag">中</span>
          <span class="lang-name">中文</span>
        </button>
      </div>
      <p class="muted" data-i18n="welcome.hint"></p>
    </div>

    <div id="welcome-brand" class="hidden">
      <h1 data-i18n="welcome.brand.title"></h1>
      <div class="lang-grid">
        <button class="lang-btn brand-btn" data-brand="yeelight">
          <span class="lang-flag">Yeelight</span>
          <span class="lang-name" data-i18n="brand.yeelight.desc"></span>
        </button>
        <button class="lang-btn brand-btn" data-brand="lifx">
          <span class="lang-flag">LIFX</span>
          <span class="lang-name" data-i18n="brand.lifx.desc"></span>
        </button>
      </div>
      <p class="muted small" data-i18n="welcome.brand.hint"></p>
    </div>
  </div>
</div>

<!-- ─── App ───────────────────────────────────────────────────────────────── -->
<div id="app" class="hidden">

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" id="brand-dot"></span>
      <div>
        <div class="brand-title" data-i18n="app.title"></div>
        <div class="brand-sub muted" data-i18n="app.subtitle"></div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="pill" id="running-pill"></span>
      <div class="lang-switch">
        <button data-lang="en" class="lang-chip">EN</button>
        <button data-lang="zh" class="lang-chip">中文</button>
      </div>
      <button class="btn ghost" id="btn-settings" data-i18n="btn.settings"></button>
    </div>
  </header>

  <main>
    <!-- Left column -->
    <div class="col-main">

      <div class="mode-cards">
        <button class="mode-card" data-mode="metrics">
          <span class="mode-title" data-i18n="mode.metrics"></span>
          <span class="mode-desc muted" data-i18n="mode.metrics.desc"></span>
        </button>
        <button class="mode-card" data-mode="commands">
          <span class="mode-title" data-i18n="mode.commands"></span>
          <span class="mode-desc muted" data-i18n="mode.commands.desc"></span>
        </button>
      </div>

      <section class="card" id="devices-card">
        <div class="row-between">
          <h2 data-i18n="panel.devices"></h2>
          <button class="btn tiny ghost" id="btn-refresh-headsets" data-i18n="btn.refresh"></button>
        </div>
        <div class="picker" id="headset-list"></div>
        <div class="empty muted" id="headset-empty" data-i18n="panel.no_headsets"></div>

        <div id="profile-block">
          <div class="subhead muted" data-i18n="panel.profiles"></div>
          <div class="picker" id="profile-list"></div>
          <div class="empty muted" id="profile-empty" data-i18n="panel.connect_first"></div>
        </div>
      </section>

      <section class="card stage">
        <div class="orb-wrap">
          <div class="orb" id="orb"></div>
        </div>
        <div class="stage-info">
          <div class="stage-label muted" data-i18n="panel.leader"></div>
          <div class="stage-value" id="leader-label">—</div>
          <div class="stage-hex" id="leader-hex">—</div>
          <div class="stage-hsv muted" id="leader-hsv"></div>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="panel.live"></h2>
        <div id="metrics-view">
          <div class="bars" id="metric-bars"></div>
        </div>
        <div id="commands-view" class="hidden">
          <div class="cmd-power">
            <div class="row-between">
              <span class="muted" data-i18n="panel.power"></span>
              <span id="cmd-power-value">0.00</span>
            </div>
            <div class="bar-track"><div class="bar-fill" id="cmd-power-bar"></div></div>
          </div>
          <div class="subhead muted" data-i18n="panel.actions"></div>
          <div class="chips" id="action-chips"></div>
        </div>
        <div class="empty muted" id="live-empty" data-i18n="panel.waiting"></div>
      </section>
    </div>

    <!-- Right column -->
    <aside class="col-side">
      <section class="card">
        <h2 data-i18n="panel.status"></h2>
        <div class="steps" id="steps"></div>
      </section>

      <section class="card log-card">
        <div class="row-between">
          <h2 data-i18n="panel.log"></h2>
          <button class="btn tiny ghost" id="btn-clear-log" data-i18n="btn.clear"></button>
        </div>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </main>

  <footer class="bottombar">
    <button class="btn primary big" id="btn-run"></button>
  </footer>
</div>

<!-- ─── Settings ──────────────────────────────────────────────────────────── -->
<div id="settings" class="overlay hidden">
  <div class="modal">
    <div class="row-between modal-head">
      <h1 data-i18n="setup.title"></h1>
      <button class="btn ghost" id="btn-close-settings" data-i18n="btn.close"></button>
    </div>

    <div class="modal-body">
      <section class="field-group">
        <h3 data-i18n="setup.credentials"></h3>
        <p class="muted small" data-i18n="setup.credentials.hint"></p>
        <label data-i18n="setup.client_id"></label>
        <input type="text" id="in-client-id" spellcheck="false" autocomplete="off" />
        <label data-i18n="setup.client_secret"></label>
        <input type="password" id="in-client-secret" spellcheck="false" autocomplete="off" />
        <p class="muted small hidden" id="secret-saved-note" data-i18n="setup.secret_saved"></p>
      </section>

      <section class="field-group">
        <h3 data-i18n="setup.bulb"></h3>
        <label data-i18n="setup.brand"></label>
        <select id="in-brand">
          <option value="yeelight">Yeelight</option>
          <option value="lifx">LIFX</option>
        </select>
        <p class="muted small" id="brand-hint"></p>
        <label data-i18n="setup.bulb_ip"></label>
        <div class="row-gap">
          <input type="text" id="in-bulb-ip" spellcheck="false" autocomplete="off" />
          <button class="btn ghost" id="btn-discover" data-i18n="btn.discover"></button>
        </div>
      </section>

      <section class="field-group">
        <h3 data-i18n="setup.profile"></h3>
        <p class="muted small" data-i18n="setup.profile.hint"></p>
        <select id="in-profile"></select>
        <p class="muted small hidden" id="no-profiles-note" data-i18n="setup.no_profiles"></p>
      </section>

      <section class="field-group">
        <h3 data-i18n="tuning.title"></h3>

        <label data-i18n="tuning.score_mode"></label>
        <select id="in-score-mode">
          <option value="adaptive" data-i18n="tuning.score_mode.adaptive"></option>
          <option value="raw" data-i18n="tuning.score_mode.raw"></option>
        </select>
        <p class="muted small" data-i18n="tuning.score_mode.hint"></p>

        <label><span data-i18n="tuning.smooth"></span> <b id="lbl-smooth"></b></label>
        <input type="range" id="in-smooth" min="0.05" max="2" step="0.05" />
        <p class="muted small" data-i18n="tuning.smooth.hint"></p>

        <label><span data-i18n="tuning.bright_min"></span> <b id="lbl-bmin"></b></label>
        <input type="range" id="in-bright-min" min="1" max="80" step="1" />

        <label><span data-i18n="tuning.bright_max"></span> <b id="lbl-bmax"></b></label>
        <input type="range" id="in-bright-max" min="20" max="100" step="1" />
      </section>
    </div>

    <div class="modal-foot">
      <button class="btn primary" id="btn-save" data-i18n="btn.save"></button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
